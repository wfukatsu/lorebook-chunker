name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (dev + full + bench)
        run: |
          python -m pip install --upgrade pip
          # [dev]: pytest, pytest-mock
          # [full]: charset-normalizer (encoding auto-detection)
          # [bench]: ranx (RAG eval benchmark)
          pip install -e '.[dev,full,bench]'

      - name: Run pytest
        run: pytest tests/ -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # RUN_LLM / RUN_OLLAMA / RUN_LARGE intentionally unset:
          # those tests are gated for local / manual verification.
