name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Hard timeout — prior run hung on transformer weight download for 6h.
    # 40 min covers cold HF fetch (~5 min) + dep install (~3 min) +
    # full pytest with real GiNZA ELECTRA inference on the 2-CPU runner
    # (~20 min for 302 tests, several do full IngestRunner cycles).
    # Subsequent runs hit the HF cache and complete much faster (~10 min total).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 3.12 は pyproject 的には許可されているが、実運用上は
        # tokenizers<0.14 の prebuilt wheel が 3.12 向けに配布されておらず
        # Rust source build が失敗する (spacy-transformers 1.1.9 経由で
        # tokenizers 0.13 系を強制されるため). 3.11 のみを CI で verify し、
        # 3.12 ローカル利用は Rust toolchain 導入が前提となる旨を
        # README 側で明示する.
        python-version: ["3.11"]

    env:
      # Disable HuggingFace progress bars — TTY animation can hang in non-TTY CI.
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # Avoid tokenizers parallel-init warning + potential fork issues in CI.
      TOKENIZERS_PARALLELISM: "false"
      # PyTorch on CPU: keep thread count modest to avoid runner OOM.
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache HuggingFace Hub (transformer weights)
        # ja_ginza_electra triggers a ~400MB transformer-weights download
        # on first JapaneseAnalyzer() construction. Cache so subsequent runs
        # reuse the weights and the cold-start hang risk is bounded to one run.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Key includes ja-ginza-electra wheel sha (pyproject pin) so cache
          # invalidates when the model URL changes.
          key: hf-cache-${{ runner.os }}-ja_ginza_electra-5.2.0
          restore-keys: |
            hf-cache-${{ runner.os }}-

      - name: Install dependencies (dev + full + bench)
        run: |
          python -m pip install --upgrade pip
          # [dev]: pytest, pytest-mock
          # [full]: charset-normalizer (encoding auto-detection)
          # [bench]: ranx (RAG eval benchmark)
          pip install -e '.[dev,full,bench]'

      - name: Pre-download GiNZA ELECTRA weights (with timeout)
        # Force the transformer download to happen as a discrete, time-bounded
        # step. If it hangs here we fail fast (10 min) instead of timing out
        # mid-pytest after 30 min. Subsequent runs hit the actions/cache hit.
        #
        # Use JapaneseAnalyzer (not bare spacy.load) because Ginza 5.2 ships
        # `compound_splitter.split_mode = None` which fails spaCy 3.8 Config
        # validation (`None is not <class 'str'>`). JapaneseAnalyzer applies
        # the runtime config override that bypasses this. See README §Ginza
        # 5.2 × spacy 3.8 互換シム.
        timeout-minutes: 10
        run: |
          python -c "from lorebook_chunker.analyzer import JapaneseAnalyzer; a = JapaneseAnalyzer(); print('GiNZA ELECTRA loaded; tokenizer ready')"

      - name: Run pytest (unit + light integration; deselect heavyweight bench)
        # Pytest cap: 25 min. We deselect two integration-tier test classes
        # that do FULL real-GiNZA IngestRunner cycles (no stub analyzer):
        #   - tests/test_bench.py::TestBenchRun        (each test = 1-3 full ingests)
        #   - tests/test_bench.py::TestBenchSubprocess (subprocess-spawned full ingest)
        # These take 60-180s/test under CPU-only ELECTRA inference on the
        # 2-CPU GitHub-hosted runner, blowing the budget. Their unit-tier
        # equivalents (TestParseConfigSpec / TestLoadQrels / TestEvaluateRun)
        # still run and cover ~80% of bench.run's logic without needing a
        # full ingest. Run the deselected tests locally before merging
        # significant bench.py changes.
        #
        # test_smoke.py heavy paths are already env-gated (RUN_LLM=1 /
        # RUN_OLLAMA=1) and skip_until_real_samples (6 author-written files
        # not currently committed), so no deselect needed there.
        timeout-minutes: 25
        run: |
          pytest tests/ -v \
            --deselect tests/test_bench.py::TestBenchRun \
            --deselect tests/test_bench.py::TestBenchSubprocess
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # RUN_LLM / RUN_OLLAMA / RUN_LARGE intentionally unset:
          # those tests are gated for local / manual verification.
