[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lorebook-chunker"
version = "0.1.0"
description = "日本語 RAG 向けチャンク化 + TF-IDF + 固有名詞 Wiki (Lorebook) CLI"
readme = "README.md"
# Python 3.13+ では transformers 4.25 系がピンする tokenizers<0.14 の
# prebuilt wheel が未配布で、Rust ソースビルドにも失敗する. Ginza 5.2 が
# このスタックに依存している以上、当面 3.11/3.12 のみ対応とする.
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Scalar Labs" }]

dependencies = [
    # Ginza 5.2 の compound_splitter factory 登録は spacy 3.9 以降の
    # Config 検証系で None 既定値が弾かれる可能性があるため上限を <3.9 に
    # 保つ (3.8.x まで analyzer.py の runtime fix で吸収済み).
    "spacy>=3.7,<3.9",
    "ginza>=5.2",
    # F-023: sha256 ピンで tag 再利用や repo 改ざんに対する supply-chain 防衛.
    "ja-ginza-electra @ https://github.com/megagonlabs/ginza/releases/download/v5.2.0/ja_ginza_electra-5.2.0-py3-none-any.whl#sha256=e407d95f656e140fe5bc1b36de08bc6843d73abb28cfbfb95714baafe09709fc",
    "sudachipy>=0.6",
    "sudachidict-core",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "numpy>=1.26,<2",
    "anthropic>=0.34",
    "ollama>=0.3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]
# --analyzer-backend ginza で使う軽量モデル. transformer を含まないので
# CPU inference が ELECTRA 版に比べて 5〜10x 速い (NER 精度は若干トレード).
# `pip install -e '.[fast]'` で opt-in.
fast = [
    "ja_ginza>=5.2,<6",
]

[project.scripts]
lorebook-chunker = "lorebook_chunker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lorebook_chunker = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
