[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lorebook-chunker"
version = "0.1.0"
description = "日本語 RAG 向けチャンク化 + TF-IDF + 固有名詞 Wiki (Lorebook) CLI"
readme = "README.md"
# Python 3.13+ では transformers 4.25 系がピンする tokenizers<0.14 の
# prebuilt wheel が未配布で、Rust ソースビルドにも失敗する. Ginza 5.2 が
# このスタックに依存している以上、当面 3.11/3.12 のみ対応とする.
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Scalar Labs" }]

dependencies = [
    # Ginza 5.2 の compound_splitter factory 登録は spacy 3.9 以降の
    # Config 検証系で None 既定値が弾かれる可能性があるため上限を <3.9 に
    # 保つ (3.8.x まで analyzer.py の runtime fix で吸収済み).
    "spacy>=3.7,<3.9",
    "ginza>=5.2",
    # F-023: sha256 ピンで tag 再利用や repo 改ざんに対する supply-chain 防衛.
    "ja-ginza-electra @ https://github.com/megagonlabs/ginza/releases/download/v5.2.0/ja_ginza_electra-5.2.0-py3-none-any.whl#sha256=e407d95f656e140fe5bc1b36de08bc6843d73abb28cfbfb95714baafe09709fc",
    "sudachipy>=0.6",
    "sudachidict-core",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "numpy>=1.26,<2",
    "anthropic>=0.34",
    "ollama>=0.3",
    "pyyaml>=6",
]

[project.optional-dependencies]
# ----------------------------------------------------------------------
# インストールプロファイル (5 種類). 組み合わせ可.
#
#   minimal : `pip install lorebook-chunker`            (extra 無し, UTF-8 only)
#   fast    : `pip install lorebook-chunker[fast]`      + ja_ginza 軽量モデル
#   full    : `pip install lorebook-chunker[full]`      + charset-normalizer
#   bench   : `pip install lorebook-chunker[bench]`     + ranx (RAG 評価)
#   dev     : `pip install lorebook-chunker[dev]`       + pytest (コントリビュータ)
#
# 詳細は README「インストール > 推奨プロファイル」を参照.
# ----------------------------------------------------------------------
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]
# --analyzer-backend ginza で使う軽量モデル. transformer を含まないので
# CPU inference が ELECTRA 版に比べて 5〜10x 速い (NER 精度は若干トレード).
# `pip install -e '.[fast]'` で opt-in.
fast = [
    "ja_ginza>=5.2,<6",
]
# U3: `--encoding auto` の検出器フォールバック (Shift-JIS / CP932 / EUC-JP 等).
# 未導入環境では utf-8-sig しか通らず非 UTF-8 は skip される. `[full]` extra
# で opt-in することで charset-normalizer による検出が有効になる.
full = [
    "charset-normalizer>=3.4",
]
# U7/U9: RAG 検索評価ベンチマーク. `scripts/bench.py` (U9) が ranx を使う.
# `pip install -e '.[bench]'` で opt-in. 本ベンチマークは自前コーパスの
# チューニング / regression 検出用途であり、ツール間比較は対象外.
bench = [
    "ranx>=0.3",
]

[project.scripts]
lorebook-chunker = "lorebook_chunker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lorebook_chunker = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
